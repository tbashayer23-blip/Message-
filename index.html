<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>هناك رسالة تنتظركِ 💌</title>
<style>
:root{--pink:#b85b7b;--ink:#653e50;--gold:#c99c57}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#fff9f3,transparent 45%),linear-gradient(145deg,#fbe3ea,#fff7f2 55%,#f4dce8);font-family:Tahoma,Arial,sans-serif;color:var(--ink);padding:24px}.card{width:min(100%,510px);background:#ffffffd9;border:1px solid #fff;box-shadow:0 22px 70px #a35c7826;border-radius:30px;text-align:center;padding:40px 27px;position:relative;overflow:hidden}.card:before{content:'✦  ✧  ✦';position:absolute;top:14px;right:22px;color:var(--gold);opacity:.6}.envelope{font-size:85px;filter:drop-shadow(0 10px 9px #ad65704d);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}h1{font-size:clamp(26px,6vw,36px);margin:14px 0;color:#9d4969}p{line-height:1.9}label{display:block;text-align:right;font-size:14px;margin:25px 0 8px;font-weight:bold}input{width:100%;padding:16px;border:2px solid #f0cdd9;border-radius:14px;font-size:18px;text-align:center;direction:ltr;letter-spacing:1px;outline:none;background:white}input:focus{border-color:var(--pink)}button{background:linear-gradient(110deg,#b55b7c,#d17d94);color:white;border:0;border-radius:14px;padding:16px 20px;font-size:17px;font-weight:bold;cursor:pointer;width:100%;margin-top:17px;box-shadow:0 7px 20px #a44b6a38}button:disabled{opacity:.65;cursor:wait}.error{min-height:24px;color:#a32e45;font-size:14px;margin-top:12px}.letter{display:none;margin-top:22px;background:#fffaf2;border:1px solid #e9d4aa;border-radius:18px;padding:26px 22px;box-shadow:0 8px 24px #c99c5720;animation:reveal .7s ease-out}.letter.open{display:block}@keyframes reveal{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}.letter h2{color:#9d4969}.message{white-space:pre-wrap;line-height:2.1;font-size:17px;overflow-wrap:anywhere}.sign{margin-top:24px;color:#9b6b55;font-weight:bold}.hint{font-size:12px;opacity:.7;margin-top:18px}footer{font-size:14px;margin-top:28px;color:#916276}#reset{background:transparent;color:#9d4969;box-shadow:none;border:1px solid #e5b9c8}
</style>
</head>
<body><main class="card"><div class="envelope" aria-hidden="true">💌</div><h1>هناك رسالة تنتظركِ</h1><p>معكِ رسالة مميزة، كُتبت لكِ وحدكِ 🌷<br>أدخلي رمزكِ لتكتشفي الكلمات التي تنتظركِ.</p>
<form id="form"><label for="code">رمز رسالتكِ السري</label><input id="code" placeholder="مثال: B26-05240" autocomplete="off" required maxlength="40"><button id="submit" type="submit">افتحي رسالتكِ ✨</button></form><div id="error" class="error" role="status" aria-live="polite"></div>
<section id="letter" class="letter" aria-live="polite"><h2 id="student"></h2><div id="message" class="message"></div><div class="sign">بكل محبة، أ. بشاير الحربي 💗</div><button id="reset" type="button">قراءة رسالة برمز آخر</button></section><div class="hint">يمكنكِ العودة وقراءة رسالتكِ متى شئتِ.</div><footer>لأن لكل طالبة أثرًا لا يُنسى ✨</footer></main>
<script>
// ضعي هنا رابط وظيفة Supabase Edge Function المنشورة لديكِ، ولا تضعي أي مفتاح سري.
const FUNCTION_URL = 'PASTE_YOUR_SUPABASE_FUNCTION_URL_HERE';
const form=document.getElementById('form'),code=document.getElementById('code'),button=document.getElementById('submit'),error=document.getElementById('error'),letter=document.getElementById('letter');
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';letter.classList.remove('open');const value=code.value.trim();if(!value)return;if(FUNCTION_URL.includes('PASTE_')){error.textContent='يلزم ربط الموقع بعنوان الوظيفة أولًا.';return}button.disabled=true;button.textContent='لحظة جميلة في الطريق… 💌';try{const response=await fetch(FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'تعذّر العثور على الرسالة. تحققي من الرمز.');if(!data.student_name||!data.message)throw new Error('الرد لا يحتوي على رسالة مكتملة.');document.getElementById('student').textContent='إلى '+data.student_name+' 🌷';document.getElementById('message').textContent=data.message;letter.classList.add('open');letter.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(err){error.textContent=err instanceof TypeError?'تعذّر الاتصال بالخدمة. حاولي لاحقًا.':err.message}finally{button.disabled=false;button.textContent='افتحي رسالتكِ ✨'}});
document.getElementById('reset').addEventListener('click',()=>{letter.classList.remove('open');code.value='';code.focus();error.textContent=''});
</script></body></html>
